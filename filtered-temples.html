<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="author" content="Nefi Rodriguez" />
    <meta name="description" content="Filtered temple gallery with dynamic cards and navigation filters." />
    <title>Filtered Temple Album</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700&family=Roboto:wght@400;500;700&display=swap"
        rel="stylesheet">

    <link rel="stylesheet" href="styles/filtered-temples.css" />
    <link rel="stylesheet" href="styles/filtered-temples-large.css" />

    <script src="scripts/filtered-temples.js" defer></script>
</head>

<body>
    <header class="site-header">
        <div class="header-inner">
            <p class="site-title">Temple Album</p>

            <button id="menuBtn" class="menu-btn" aria-label="Open menu" aria-expanded="false">
                &#9776;
            </button>

            <nav id="primaryNav" class="nav">
                <a href="#" data-filter="home" class="active">Home</a>
                <a href="#" data-filter="old">Old</a>
                <a href="#" data-filter="new">New</a>
                <a href="#" data-filter="large">Large</a>
                <a href="#" data-filter="small">Small</a>
            </nav>
        </div>
    </header>

    <main class="page">
        <h1 id="pageTitle">Home</h1>
        <section class="gallery" id="templeCards"></section>
    </main>

    <footer class="site-footer">
        <p>&copy;<span id="currentYear"></span> | Nefi Rodriguez | Guayaquil</p>
        <p id="lastModified"></p>
    </footer>
</body>

</html>
