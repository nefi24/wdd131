<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="author" content="Nefi Rodriguez" />
    <meta name="description" content="Temple Album - responsive gallery with hamburger navigation" />
    <title>Temple Album</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700&family=Roboto:wght@400;500&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="styles/temples.css" />
    <link rel="stylesheet" href="styles/temples-large.css" />
    <script src="scripts/temples.js" defer></script>
</head>

<body>
    <header class="site-header">
        <div class="header-inner">
            <p class="site-title">Temple Album</p>

            <button id="menuBtn" class="menu-btn" aria-label="Open menu" aria-expanded="false">
                &#9776;
            </button>

            <nav id="primaryNav" class="nav">
                <a href="#" class="active">Home</a>
                <a href="#">Old</a>
                <a href="#">New</a>
                <a href="#">Large</a>
                <a href="#">Small</a>
            </nav>
        </div>
    </header>

    <main class="page">
        <h1>Home</h1>


        <section class="gallery">
            <figure>
                <img src="images/salt-lake-city-temple.jpg" alt="Salt Lake Temple" loading="lazy" width="800"
                    height="500">
                <figcaption>Salt Lake City</figcaption>
            </figure>

            <figure>
                <img src="images/laie-temple.jpg" alt="Laie Hawaii Temple" loading="lazy" width="800" height="500">
                <figcaption>Laie Hawaii</figcaption>
            </figure>

            <figure>
                <img src="images/provo-temple.jpg" alt="Provo Utah Temple" loading="lazy" width="800" height="500">
                <figcaption>Provo Utah</figcaption>
            </figure>

            <figure>
                <img src="images/loga-temple.jpg" alt="Logan Utah Temple" loading="lazy" width="800" height="500">
                <figcaption>Logan Utah</figcaption>
            </figure>

            <figure>
                <img src="images/manti-temple.jpg" alt="Manti Utah Temple" loading="lazy" width="800" height="500">
                <figcaption>Manti Utah</figcaption>
            </figure>

            <figure>
                <img src="images/los-angeles-temple.jpg" alt="Los Angeles California Temple" loading="lazy" width="800"
                    height="500">
                <figcaption>Los Angeles California</figcaption>
            </figure>

            <figure>
                <img src="images/mexico-city-temple.jpg" alt="Mexico City Mexico Temple" loading="lazy" width="800"
                    height="500">
                <figcaption>Mexico City Mexico</figcaption>
            </figure>

            <figure>
                <img src="images/sao-paulo-temple.jpg" alt="São Paulo Brazil Temple" loading="lazy" width="800"
                    height="500">
                <figcaption>São Paulo Brazil</figcaption>
            </figure>

            <figure>
                <img src="images/rome-temple.jpg" alt="Rome Italy Temple" loading="lazy" width="800" height="500">
                <figcaption>Rome Italy</figcaption>
            </figure>
        </section>
    </main>
    <footer class="site-footer">
        <p>&copy;<span id="currentYear"></span> | Nefi Rodriguez | Guayaquil</p>
        <p id="lastModified"></p>
    </footer>
</body>

</html>
