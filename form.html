<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="author" content="Nefi Rodriguez">
    <meta name="description"
        content="Submit a detailed product review by rating features, sharing your experience, and helping others make better decisions.">
    <title>Product Review Form</title>

    <link rel="stylesheet" href="styles/form.css">
    <script src="scripts/form.js" defer></script>
</head>

<body>
    <header>
        <h1>Product Review</h1>
    </header>

    <main>
        <form method="get" action="review.html" class="review-form">
            <fieldset>
                <legend>Review a Product</legend>

                <div class="form-group">
                    <label for="productName">Product Name</label>
                    <select id="productName" name="productName" required>
                        <option value="" disabled selected>Select a Product ...</option>
                    </select>
                </div>

                <div class="form-group">
                    <p class="label-title">Overall Rating</p>

                    <div class="rating-group">
                        <div class="rating-option">
                            <label for="rating1">&star;</label>
                            <input type="radio" id="rating1" name="rating" value="1" required>
                        </div>

                        <div class="rating-option">
                            <label for="rating2">&star;&star;</label>
                            <input type="radio" id="rating2" name="rating" value="2" required>
                        </div>

                        <div class="rating-option">
                            <label for="rating3">&star;&star;&star;</label>
                            <input type="radio" id="rating3" name="rating" value="3" required>
                        </div>

                        <div class="rating-option">
                            <label for="rating4">&star;&star;&star;&star;</label>
                            <input type="radio" id="rating4" name="rating" value="4" required>
                        </div>

                        <div class="rating-option">
                            <label for="rating5">&star;&star;&star;&star;&star;</label>
                            <input type="radio" id="rating5" name="rating" value="5" required>
                        </div>
                    </div>
                </div>

                <div class="form-group">
                    <label for="installDate">Date of Installation</label>
                    <input type="date" id="installDate" name="installDate" required>
                </div>

                <div class="form-group">
                    <p class="label-title">Useful Features <span>(Check all that apply)</span></p>

                    <div class="checkbox-group">
                        <label for="durability">
                            <input type="checkbox" id="durability" name="features" value="Durability">
                            Durability
                        </label>

                        <label for="easeOfUse">
                            <input type="checkbox" id="easeOfUse" name="features" value="Ease of Use">
                            Ease of Use
                        </label>

                        <label for="performance">
                            <input type="checkbox" id="performance" name="features" value="Performance">
                            Performance
                        </label>

                        <label for="design">
                            <input type="checkbox" id="design" name="features" value="Design">
                            Design
                        </label>
                    </div>
                </div>

                <div class="form-group">
                    <label for="writtenReview">Written Review (Optional)</label>
                    <textarea id="writtenReview" name="writtenReview" rows="6"
                        placeholder="Write your review here..."></textarea>
                </div>

                <div class="form-group">
                    <label for="userName">Your Name (Optional)</label>
                    <input type="text" id="userName" name="userName" placeholder="Enter your name">
                </div>

                <div class="form-group">
                    <input type="submit" value="Post Review" class="submit-btn">
                </div>
            </fieldset>
        </form>
    </main>

    <footer class="site-footer">
        <p>&copy;<span id="currentYear"></span> | Nefi Rodriguez | Guayaquil, Ecuador</p>
        <p id="lastModified"></p>
    </footer>
</body>

</html>
